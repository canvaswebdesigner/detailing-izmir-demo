<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#0d0f10" />
    <title>Sayfa bulunamadı — Detailing İzmir</title>
    <link rel="stylesheet" href="/styles.css" />
    <style>
      .error-page { min-height: 100svh; display: grid; place-items: center; padding: 32px; overflow: hidden; background: repeating-linear-gradient(90deg, transparent 0 79px, rgba(255,255,255,.03) 79px 80px), var(--ink); }
      .error-card { position: relative; width: min(760px,100%); padding: clamp(34px,7vw,76px); border: 1px solid var(--line-dark); background: radial-gradient(circle at 85% 15%, rgba(217,60,50,.2), transparent 32%); }
      .error-code { margin: 0; color: var(--red); font-family: var(--display); font-size: clamp(90px,22vw,210px); line-height: .7; }
      .error-card h1 { margin-top: 38px; font-size: clamp(48px,9vw,82px); }
      .error-card > p:not(.error-code) { max-width: 52ch; margin: 24px 0 0; color: var(--muted); line-height: 1.7; }
      .error-actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:34px; }
    </style>
  </head>
  <body class="error-page">
    <main class="error-card">
      <p class="error-code">404</p>
      <p class="eyebrow">Yanlış dönüş</p>
      <h1>Bu yol<br /><em>atölyeye çıkmıyor.</em></h1>
      <p>Aradığınız sayfa taşınmış veya kaldırılmış olabilir. Ana sayfaya dönebilir ya da sayfayı yeniden deneyebilirsiniz.</p>
      <div class="error-actions"><button class="button button-primary" type="button" onclick="window.location.reload()">Tekrar dene</button><a class="button button-line" href="/">Ana sayfa</a></div>
    </main>
  </body>
</html>
